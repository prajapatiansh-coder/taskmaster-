{% extends "layout.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white py-4 text-center">
                    <h3 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Task</h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Task Title</label>
                            <input type="text" class="form-control bg-light" id="title" name="title" value="{{ task.title }}" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="category" class="form-label fw-semibold">Category</label>
                                <select name="category" id="category" class="form-select bg-light">
                                    <option value="Study" {{ 'selected' if task.category == 'Study' }}>Study</option>
                                    <option value="Personal" {{ 'selected' if task.category == 'Personal' }}>Personal</option>
                                    <option value="Exam" {{ 'selected' if task.category == 'Exam' }}>Exam</option>
                                    <option value="Work" {{ 'selected' if task.category == 'Work' }}>Work</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="priority" class="form-label fw-semibold">Priority</label>
                                <select name="priority" id="priority" class="form-select bg-light">
                                    <option value="High" {{ 'selected' if task.priority == 'High' }}>High</option>
                                    <option value="Medium" {{ 'selected' if task.priority == 'Medium' }}>Medium</option>
                                    <option value="Low" {{ 'selected' if task.priority == 'Low' }}>Low</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="deadline" class="form-label fw-semibold">Deadline</label>
                            <input type="date" class="form-control bg-light" id="deadline" name="deadline" value="{{ task.deadline }}">
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100 py-2 fw-bold rounded-3">Cancel</a>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm">Update Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
